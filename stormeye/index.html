<style>/* StormEye — dark storm-tracking theme */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
  font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #0b1220; color: #e8eef7; }
#map { position: absolute; inset: 0; z-index: 0; }
.leaflet-container { background: #0b1220; font-family: inherit; }

#topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 500;
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 14px; pointer-events: none; }
#appname { font-size: 20px; font-weight: 800; letter-spacing: .5px;
  text-shadow: 0 1px 6px rgba(0,0,0,.8); pointer-events: auto; }
#stormbadge { background: #d63a3a; color: #fff; font-weight: 800; font-size: 12px;
  padding: 5px 10px; border-radius: 20px; letter-spacing: .5px;
  box-shadow: 0 2px 8px rgba(0,0,0,.5); animation: pulse 2s infinite;
  cursor: pointer; pointer-events: auto; }
#storm-strip.hidden { display: none; }
#storm-strip { margin: 2px 0 10px; display: flex; flex-direction: column; gap: 6px; }
.storm-card { background: rgba(127,29,29,.55); border: 1px solid #ef4444; border-radius: 10px;
  padding: 8px 12px; cursor: pointer; }
.storm-card.ts { background: rgba(120,53,15,.5); border-color: #f59e0b; }
.storm-card .sname { font-size: 16px; font-weight: 800; }
.storm-card .sdet { font-size: 12px; color: #fecaca; margin-top: 2px; }
.storm-card.ts .sdet { color: #fde68a; }
.beach-card { background: rgba(12,74,110,.55); border: 1px solid #38bdf8; border-radius: 10px;
  padding: 8px 10px; margin: 6px 0; }
.beach-card .sname { font-size: 16px; font-weight: 800; }
.beach-card .sdet { font-size: 12px; color: #bae6fd; margin-top: 2px; }
.beach-card.hidden, #beach.hidden { display: none; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .65; } }

#searchbar { position: absolute; top: 52px; left: 10px; right: 10px; z-index: 550;
  display: flex; gap: 8px; }
#addr-input { flex: 1; background: rgba(15,23,42,.92); color: #e8eef7;
  border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
#addr-go { background: #1d4ed8; color: #fff; border: none; border-radius: 10px;
  padding: 10px 16px; font-size: 14px; font-weight: 800; }
#search-results { position: absolute; top: 100px; left: 10px; right: 10px; z-index: 550;
  background: rgba(15,23,42,.96); border: 1px solid #334155; border-radius: 10px;
  max-height: 220px; overflow-y: auto; }
#search-results.hidden { display: none; }
.sr-item { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid #1e293b; cursor: pointer; }
.sr-item:last-child { border-bottom: none; }

#navpanel { position: absolute; top: 100px; left: 10px; right: 76px; z-index: 550;
  background: rgba(29,78,216,.94); border-radius: 12px; padding: 10px 12px;
  display: flex; align-items: center; gap: 10px; }
#navpanel.hidden { display: none; }
#nav-arrow { font-size: 34px; line-height: 1; min-width: 40px; text-align: center; }
#nav-text { flex: 1; }
#nav-instr { font-weight: 800; font-size: 15px; }
#nav-sub { font-size: 12px; color: #bfdbfe; }
#nav-end { background: rgba(0,0,0,.35); color: #fff; border: 1px solid #93c5fd;
  border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 700; }

#layers { position: absolute; top: 100px; right: 10px; z-index: 500;
  display: flex; flex-direction: column; gap: 8px; }
.laybtn { background: rgba(15,23,42,.88); color: #e8eef7; border: 1px solid #334155;
  border-radius: 10px; padding: 9px 12px; font-size: 13px; font-weight: 600;
  cursor: pointer; backdrop-filter: blur(4px); }
.laybtn.active { background: #1d4ed8; border-color: #3b82f6; }

#radarslider { margin: 2px 0 10px;
  background: rgba(15,23,42,.88); border: 1px solid #334155; border-radius: 12px;
  padding: 8px 12px; display: flex; flex-direction: column; gap: 8px; }
#radarslider.hidden { display: none; }
.radar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#radar-mode { display: flex; gap: 6px; }
#radar-mode { display: flex; gap: 6px; }
.modebtn { background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
  border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
.modebtn.active { background: #1d4ed8; color: #fff; border-color: #3b82f6; }
#hint-chip.hidden, #live-updated.hidden { display: none; }
#app-ver { font-size: 10px; color: #64748b; font-weight: 400; }
#future-play.hidden { display: none; }
#time-label.hidden { display: none; }
#time-label { font-size: 12px; font-weight: 700; color: #93c5fd; text-align: center; }
#hint-chip { position: absolute; top: 100px; left: 12px; right: 12px; z-index: 560;
  background: rgba(29,78,216,.95); border-radius: 10px; padding: 9px 12px;
  font-size: 12px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
#hint-x { margin-left: 8px; cursor: pointer; font-weight: 800; }
#live-updated { font-size: 10px; color: #64748b; text-align: right; }
#op-wrap { display: flex; align-items: center; gap: 6px; flex: 1 1 100%; }
#op-wrap span { font-size: 14px; }
#op-row { display: flex; align-items: center; gap: 6px; flex: 1 1 100%; margin-top: 6px; }
#op-row.hidden { display: none; }
#op-slider { flex: 1; accent-color: #38bdf8; }
#ctl-slider { flex: 1; accent-color: #38bdf8; }

/* storm jump button (driving mode): flip between you and the hurricane */
#btn-stormjump.hidden { display: none; }
#btn-stormjump { position: absolute; right: 12px; bottom: 96px; z-index: 550;
  width: 52px; height: 52px; border-radius: 50%; font-size: 26px;
  background: rgba(127,29,29,.92); border: 2px solid #ef4444; cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.5); }
body.driving #btn-stormjump.hidden { display: none; }
body.driving #btn-stormjump:not(.hidden) { display: block; }

/* driving mode: map + live radar + nav instructions only.
   The radar slider stays so you can fade the radar while driving. */
body.driving #searchbar, body.driving #search-results,
body.driving #layers { display: none; }
body.driving #sheet { background: none; border: none; padding: 0 12px 10px; }
body.driving #sheet > :not(#radarslider) { display: none; }
body.driving #radar-mode { display: none; } /* nav = live radar only */
body.driving #navpanel { top: 52px; right: 10px; }
body.driving #mapwrap { position: fixed; inset: 0; }

/* (storm pulse keyframes live with the storm marker styles above) */

#sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 600;
  background: rgba(13,20,36,.96); border-top: 1px solid #334155;
  border-radius: 16px 16px 0 0; padding: 6px 16px 14px;
  max-height: 42%; overflow-y: auto; backdrop-filter: blur(6px);
  transition: transform .25s ease; }
#sheet.locked { overflow-y: hidden; }
#sheet-handle { width: 44px; height: 4px; border-radius: 2px; background: #475569;
  margin: 4px auto 10px; touch-action: none; cursor: grab;
  padding: 8px 20px; background-clip: content-box; }
#wx-now { font-size: 14px; line-height: 1.55; }
#wx-now .big { font-size: 30px; font-weight: 800; }
#wx-now .sub { color: #94a3b8; font-size: 12px; }
#storm-info { margin-top: 10px; padding-top: 10px; border-top: 1px solid #334155;
  font-size: 14px; line-height: 1.6; }
#storm-info.hidden { display: none; }

#alerts { margin-bottom: 8px; }
#alerts.hidden { display: none; }
.alert-card { background: #7f1d1d; border: 1px solid #ef4444; border-radius: 10px;
  padding: 8px 12px; margin-bottom: 6px; font-size: 13px; }
.alert-card .aevent { font-weight: 800; font-size: 14px; }
.alert-card.watch { background: #78350f; border-color: #f59e0b; }

#rain-line { margin: 6px 0 2px; color: #93c5fd; font-weight: 700; font-size: 13px; }

#hourly-strip { display: flex; overflow-x: auto; gap: 8px; padding: 8px 0;
  border-top: 1px solid #334155; margin-top: 8px; }
.hcell { flex: 0 0 auto; text-align: center; font-size: 11px; color: #cbd5e1;
  background: rgba(30,41,59,.7); border-radius: 10px; padding: 8px 10px; min-width: 58px; }
.hcell .ht { font-weight: 800; color: #fff; font-size: 12px; }
.hcell .hp { color: #60a5fa; font-weight: 700; }

#daily-list { border-top: 1px solid #334155; margin-top: 4px; padding-top: 4px; }
.drow { display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; padding: 5px 2px; border-bottom: 1px solid #1e293b; }
.drow .dd { font-weight: 700; width: 44px; }
.drow .dp { color: #60a5fa; font-weight: 700; }
.drow .dt { color: #cbd5e1; }
#storm-info .sname { font-size: 18px; font-weight: 800; }
.cat { display: inline-block; font-weight: 800; font-size: 12px; padding: 2px 8px;
  border-radius: 8px; margin-left: 8px; }
.cat-hu { background: #dc2626; } .cat-ts { background: #d97706; }
.cat-td { background: #0284c7; }
.storm-row { display: flex; justify-content: space-between; padding: 2px 0; }
.storm-row span:last-child { font-weight: 700; }

/* storm markers: small category-colored dot + name label */
.storm-pin { position: relative; }
.storm-mdot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff;
  transform: translate(-6px, -6px); box-shadow: 0 1px 5px rgba(0,0,0,.6); }
.storm-name { position: absolute; top: 8px; left: 10px; background: rgba(15,23,42,.92);
  color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 8px;
  white-space: nowrap; border: 1px solid #475569; }
.fcast-dot { background: #fff; border: 2px solid #1d4ed8; border-radius: 50%;
  width: 12px; height: 12px; }
.fcast-label { background: rgba(15,23,42,.9); color: #fff; font-size: 10px;
  font-weight: 700; padding: 1px 5px; border-radius: 6px; white-space: nowrap;
  border: 1px solid #475569; }
</style>
</head>
<body>
<div id="map"></div>

<div id="topbar">
  <div id="appname">🌀 StormEye <span id="app-ver">v22</span></div>
  <div id="stormbadge" class="hidden">1 ACTIVE</div>
</div>

<div id="searchbar">
  <input id="addr-input" type="text" placeholder="Where to? (address or place)" autocomplete="off">

<div id="hint-chip" class="hidden">Tap <b>Live</b> for radar · <b>Storms</b> for hurricanes · hold <b>⌂ Home</b> to set your address <span id="hint-x">✕</span></div>

<div id="navpanel" class="hidden">
  <div id="nav-arrow">⬆️</div>

    <div id="nav-instr">—</div>

  </div>

<div id="layers">
  <button id="btn-base" class="laybtn">🛰 Map</button>

  <button id="btn-me" class="laybtn">📍 Me</button>
  <button id="btn-home" class="laybtn">⌂ Home</button>

</div>

<div id="sheet">
  <div id="sheet-handle"></div>
  <div id="radarslider" class="hidden">
    <div class="radar-row">
      <div id="radar-mode">
        <button id="mode-live" class="modebtn active">Live</button>
        <button id="mode-future" class="modebtn">Future</button>
        <button id="mode-past" class="modebtn">Past</button>
        <button id="mode-sat" class="modebtn">Sat</button>
      </div>
      <div id="op-wrap" title="Radar control">
        <span id="slider-ico">🌧</span><input type="range" id="ctl-slider" min="0" max="100" value="70" step="1">
        <button id="future-play" class="modebtn hidden" title="Play forecast">▶</button>
      </div>
      <div id="op-row" class="hidden" title="Overlay opacity">
        <span>🌧</span><input type="range" id="op-slider" min="0" max="100" value="70" step="1">
      </div>
    </div>
    <div id="time-label" class="hidden">--</div>
    <div id="live-updated" class="hidden"></div>
  </div>
  <div id="storm-strip" class="hidden"></div>
  <div id="alerts" class="hidden"></div>
  <div id="beach" class="hidden"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>/* StormEye app logic: NHC storms + ATCF forecast track + RainViewer future radar + Open-Meteo */
(function () {
  "use strict";

  var HOME = { lat: 30.774, lon: -85.231, name: "Marianna, FL" };
  try { var _h = JSON.parse(localStorage.getItem("stormeye_home") || "null"); if (_h && _h.lat) HOME = _h; } catch (e) {}
  function markHintSeen() {
    try { localStorage.setItem("stormeye_hint_seen", "1"); } catch (e) {}
    $("hint-chip").classList.add("hidden");
  }
  var hintSeen = false;
  try { hintSeen = !!localStorage.getItem("stormeye_hint_seen"); } catch (e) {}
  var FAV = null;
  try { FAV = JSON.parse(localStorage.getItem("stormeye_fav") || "null"); } catch (e) {}
  // Overlay prefs: first run = clean map, everything off. Choices persist after.
  var PREFS = { radar: null, sat: false, storms: false };
  try { var _p = JSON.parse(localStorage.getItem("stormeye_prefs") || "null"); if (_p) PREFS = _p; } catch (e) {}
  var view = PREFS.view || null, stormsOn = !!PREFS.storms; // view: live|future|past|sat|null (exclusive)
  if (!PREFS.view && PREFS.radar) view = PREFS.radar; // migrate old pref
  function savePrefs() {
    try { localStorage.setItem("stormeye_prefs", JSON.stringify({ view: view, storms: stormsOn })); } catch (e) {}
  }
  var NHC = "https://www.nhc.noaa.gov";
  var map, radarLayer = null, stormLayer = null, homeMarker = null;
  var radarFrames = [], radarIdx = 0, radarTimer = null;
  var satFrames = [];
  var storms = [];
  var meMarker = null, meFollow = false, mePos = null;
  var navActive = false, navRoute = null, navSteps = [], navDest = null, navLine = null, navDestMk = null;

  // ---------- map ----------
  map = L.map("map", { zoomControl: false, attributionControl: true }).setView([HOME.lat, HOME.lon], 9);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  var osmBase = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: "© OpenStreetMap · NHC · RainViewer · Open-Meteo"
  }).addTo(map);
  map._baseOSM = osmBase;

  function $(id) { return document.getElementById(id); }

  // ---------- current + hourly + daily (Open-Meteo) ----------
  function wxCodeText(c) {
    var m = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Overcast",
      45: "Fog", 48: "Icy fog", 51: "Light drizzle", 53: "Drizzle", 55: "Heavy drizzle",
      61: "Light rain", 63: "Rain", 65: "Heavy rain", 71: "Light snow", 73: "Snow",
      75: "Heavy snow", 80: "Showers", 81: "Showers", 82: "Violent showers",
      95: "Thunderstorm", 96: "Storm + hail", 99: "Storm + hail" };
    return m[c] || "—";
  }
  function hourLabel(iso) {
    var d = new Date(iso), h = d.getHours(), ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    return h + " " + ap;
  }
  function dayLabel(iso, i) {
    if (i === 0) return "Today";
    return ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"][new Date(iso).getDay()];
  }
  function loadWeather() {
    var u = "https://api.open-meteo.com/v1/forecast?latitude=" + HOME.lat +
      "&longitude=" + HOME.lon +
      "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_gusts_10m" +
      "&hourly=temperature_2m,precipitation_probability,weather_code" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
      "&timezone=America%2FChicago&forecast_days=7&temperature_unit=fahrenheit&wind_speed_unit=mph";
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      var c = d.current || {};
      $("wx-now").innerHTML =
        '<div class="big">' + Math.round(c.temperature_2m) + "°F</div>" +
        "<div>" + wxCodeText(c.weather_code) + " · " + HOME.name + "</div>" +
        '<div class="sub">Wind ' + Math.round(c.wind_speed_10m) + " mph · Gusts " +
        Math.round(c.wind_gusts_10m) + " mph · Humidity " + c.relative_humidity_2m + "%</div>";

      // rain timing line (for driving)
      try {
        var probs = d.hourly.precipitation_probability, times = d.hourly.time;
        var nowH = new Date(c.time).getTime(), msg = "No rain expected in the next 24h.";
        for (var i = 0; i < 24 && i < probs.length; i++) {
          if (probs[i] >= 50) {
            msg = "🌧 Rain likely around " + hourLabel(times[i]) + " (" + probs[i] + "%).";
            break;
          }
        }
        $("rain-line").textContent = msg;
      } catch (e) {}

      // hourly strip
      try {
        var html = "", n = Math.min(24, d.hourly.time.length);
        for (var j = 0; j < n; j++) {
          html += '<div class="hcell"><div class="ht">' + (j === 0 ? "Now" : hourLabel(d.hourly.time[j])) +
            "</div><div>" + Math.round(d.hourly.temperature_2m[j]) + "°</div>" +
            '<div class="hp">' + d.hourly.precipitation_probability[j] + "%</div></div>";
        }
        $("hourly-strip").innerHTML = html;
      } catch (e) {}

      // 7-day
      try {
        var dh = "", dd = d.daily;
        for (var k = 0; k < dd.time.length; k++) {
          dh += '<div class="drow"><span class="dd">' + dayLabel(dd.time[k], k) + "</span>" +
            "<span>" + wxCodeText(dd.weather_code[k]) + "</span>" +
            '<span class="dp">' + dd.precipitation_probability_max[k] + "%</span>" +
            '<span class="dt">' + Math.round(dd.temperature_2m_min[k]) + "° / " + Math.round(dd.temperature_2m_max[k]) + "°</span></div>";
        }
        $("daily-list").innerHTML = dh;
      } catch (e) {}
    }).catch(function () { $("wx-now").textContent = "Weather unavailable offline."; });
  }

  // ---------- NWS alerts ----------
  function loadAlerts() {
    var u = "https://api.weather.gov/alerts/active?point=" + HOME.lat + "," + HOME.lon;
    fetch(u, { headers: { "Accept": "application/geo+json" } }).then(function (r) { return r.json(); })
      .then(function (d) {
        var feats = (d.features || []).slice(0, 3), el = $("alerts");
        if (!feats.length) { el.classList.add("hidden"); el.innerHTML = ""; return; }
        var html = "";
        feats.forEach(function (f) {
          var p = f.properties || {}, watch = /watch/i.test(p.event || "");
          html += '<div class="alert-card' + (watch ? " watch" : "") + '"><div class="aevent">⚠ ' +
            p.event + "</div><div>" + (p.headline || "") + "</div></div>";
        });
        el.innerHTML = html;
        el.classList.remove("hidden");
      }).catch(function () {});
  }

  // ---------- beach: shown only when you're actually near the coast ----------
  // Panhandle beach reference points; the card appears within 25 miles.
  // Inland (Marianna, Bristol, Blountstown…) it stays hidden.
  var BEACHES = [
    [30.42, -86.62], [30.39, -86.87], [30.33, -87.14], [30.28, -87.55],
    [30.32, -86.14], [30.21, -85.86], [29.94, -85.41], [29.81, -85.31],
    [29.67, -85.05]
  ];
  var BEACH_EV = /beach|high surf|rip current|coastal/i;
  var beachCheckedAt = 0, beachPos = null;
  function nearBeach(lat, lon) {
    for (var i = 0; i < BEACHES.length; i++) {
      if (distM(lat, lon, BEACHES[i][0], BEACHES[i][1]) < 25 * 1609.34) return true;
    }
    return false;
  }
  function maybeLoadBeach(lat, lon) {
    if (Date.now() - beachCheckedAt < 15 * 60000 && beachPos &&
        distM(lat, lon, beachPos.lat, beachPos.lon) < 5 * 1609.34) return; // throttled
    beachCheckedAt = Date.now();
    beachPos = { lat: lat, lon: lon };
    loadBeach(lat, lon);
  }
  function loadBeach(lat, lon) {
    var el = $("beach");
    if (!nearBeach(lat, lon)) { el.classList.add("hidden"); el.innerHTML = ""; return; }
    var mu = "https://marine-api.open-meteo.com/v1/marine?latitude=" + lat.toFixed(2) +
      "&longitude=" + lon.toFixed(2) + "&hourly=wave_height&forecast_days=1&timezone=auto";
    var au = "https://api.weather.gov/alerts/active?point=" + lat.toFixed(4) + "," + lon.toFixed(4);
    var waves = "—", alertsHtml = "", done = 0;
    function render() {
      if (++done < 2) return;
      el.innerHTML = '<div class="beach-card"><div class="sname">🏖 Beach</div>' +
        '<div class="sdet">Waves ' + waves + " · near you</div>" + alertsHtml + "</div>";
      el.classList.remove("hidden");
    }
    fetch(mu).then(function (r) { return r.json(); }).then(function (d) {
      try {
        var times = d.hourly.time, wh = d.hourly.wave_height, nowMs = Date.now();
        var best = 0, bestDiff = 1e15;
        for (var i = 0; i < times.length; i++) {
          var diff = Math.abs(new Date(times[i]).getTime() - nowMs);
          if (diff < bestDiff) { bestDiff = diff; best = i; }
        }
        waves = Math.round(wh[best] * 3.28084 * 10) / 10 + " ft";
      } catch (e) {}
      render();
    }).catch(render);
    fetch(au, { headers: { "Accept": "application/geo+json" } }).then(function (r) { return r.json(); })
      .then(function (d) {
        (d.features || []).forEach(function (f) {
          var p = f.properties || {};
          if (BEACH_EV.test(p.event || "")) alertsHtml += '<div class="sdet">⚠ ' + p.event + "</div>";
        });
        render();
      }).catch(render);
  }

  // ---------- storms (NHC) ----------
  function parseCoord(v) {
    // "25.4N" -> 25.4, "88.4W" -> -88.4
    if (v == null) return NaN;
    var m = String(v).trim().match(/^([\d.]+)\s*([NSEW])/i);
    if (!m) return parseFloat(v);
    var n = parseFloat(m[1]);
    var hemi = m[2].toUpperCase();
    return (hemi === "S" || hemi === "W") ? -n : n;
  }
  function catOf(s) {
    var cls = (s.classification || "").toUpperCase(), w = parseInt(s.intensity || "0", 10);
    if (cls === "HU" || w >= 64) return { t: w >= 96 ? "H2+" : "H1", c: "cat-hu" };
    if (cls === "TS" || w >= 34) return { t: "TS", c: "cat-ts" };
    return { t: "TD", c: "cat-td" };
  }
  function parseAtcf(text) {
    // "AL, 09, 2026100900, 03, OFCL, 12, 271N, 876W, 100, 0, HU, ..."
    var seen = {}, pts = [], runMs = 0;
    text.split("\n").forEach(function (line) {
      var f = line.split(",").map(function (x) { return x.trim(); });
      if (f.length < 10 || f[4] !== "OFCL") return;
      if (!runMs && /^\d{10}$/.test(f[2])) {
        runMs = Date.UTC(+f[2].slice(0, 4), +f[2].slice(4, 6) - 1, +f[2].slice(6, 8), +f[2].slice(8, 10));
      }
      var tau = parseInt(f[5], 10);
      if (seen[tau]) return;
      seen[tau] = true;
      var la = f[6], lo = f[7];
      var lat = parseFloat(la.slice(0, -1)) / 10 * (la.slice(-1) === "S" ? -1 : 1);
      var lon = parseFloat(lo.slice(0, -1)) / 10 * (lo.slice(-1) === "W" ? -1 : 1);
      if (!isFinite(lat) || !isFinite(lon)) return;
      pts.push({ tau: tau, lat: lat, lon: lon, wind: parseInt(f[8], 10) || 0,
                 t: runMs ? runMs + tau * 3600000 : 0 });
    });
    pts.sort(function (a, b) { return a.tau - b.tau; });
    return pts;
  }
  // interpolate a storm's forecast position at wall-clock time t (ms)
  function stormPosAt(s, t) {
    var pts = s.forecastTrack;
    if (!pts || !pts.length || !pts[0].t) return null;
    if (t <= pts[0].t) return [pts[0].lat, pts[0].lon];
    for (var i = 1; i < pts.length; i++) {
      if (t <= pts[i].t) {
        var a = pts[i - 1], b = pts[i], k = (t - a.t) / Math.max(1, b.t - a.t);
        return [a.lat + (b.lat - a.lat) * k, a.lon + (b.lon - a.lon) * k];
      }
    }
    var l = pts[pts.length - 1];
    return [l.lat, l.lon];
  }
  function moveStormsTo(t) {
    storms.forEach(function (s) {
      if (!s.marker) return;
      var p = t == null ? null : stormPosAt(s, t);
      s.marker.setLatLng(p || s.homeLatLng);
    });
  }
  function loadStorms() {
    fetch(NHC + "/CurrentStorms.json").then(function (r) { return r.json(); })
      .then(function (d) {
        storms = (d.activeStorms || []).filter(function (s) {
          return /^(HU|TS|TD|ST|SD)$/.test((s.classification || "").toUpperCase());
        });
        storms.forEach(function (s) {
          s.latitudeNumeric = parseCoord(s.latitude);
          s.longitudeNumeric = parseCoord(s.longitude);
        });
        var badge = $("stormbadge");
        if (storms.length) {
          badge.textContent = storms.length + " ACTIVE";
          badge.classList.remove("hidden");
        } else { badge.classList.add("hidden"); }
        if (stormLayer) map.removeLayer(stormLayer);
        stormLayer = L.layerGroup();
        if (stormsOn) stormLayer.addTo(map);
        renderStormStrip();
        storms.forEach(function (s) { drawStorm(s, function () {}); });
        if (!storms.length) fitStorms();
      })
      .catch(function () { /* offline: keep map usable */ });
  }
  function renderStormStrip() {
    var box = $("storm-strip");
    if (!storms.length) { box.classList.add("hidden"); box.innerHTML = ""; return; }
    var html = "";
    storms.forEach(function (s, i) {
      var cat = catOf(s);
      var cls = cat.c === "cat-hu" ? "" : " ts";
      html += '<div class="storm-card' + cls + '" data-i="' + i + '">' +
        '<div class="sname">' + s.name + ' <span class="cat ' + cat.c + '">' + cat.t + "</span></div>" +
        '<div class="sdet">' + s.intensity + " kt · " + s.latitude + " " + s.longitude +
        (s.movementDir ? " · moving " + degToCompass(s.movementDir) + " at " + s.movementSpeed + " kt" : "") +
        "</div></div>";
    });
    box.innerHTML = html;
    box.classList.remove("hidden");
    if (navActive && storms.length) $("btn-stormjump").classList.remove("hidden");
    Array.prototype.forEach.call(box.children, function (el) {
      el.onclick = function () {
        var s = storms[parseInt(el.getAttribute("data-i"), 10)];
        viewStorm(s);
      };
    });
  }
  function drawStorm(s, cb) {
    var lat = s.latitudeNumeric, lon = s.longitudeNumeric;
    var cat = catOf(s);
    var scol = cat.c === "cat-hu" ? "#ef4444" : (cat.c === "cat-ts" ? "#f59e0b" : "#eab308");
    var icon = L.divIcon({ className: "", html:
      '<div class="storm-pin"><div class="storm-mdot" style="background:' + scol + '"></div>' +
      '<div class="storm-name">' + s.name + " " + cat.t + "</div></div>",
      iconSize: [0, 0], iconAnchor: [0, 0] });
    var mk = L.marker([lat, lon], { icon: icon }).addTo(stormLayer);
    mk.on("click", function () { showStorm(s, null); });
    s.marker = mk;
    s.homeLatLng = [lat, lon];
    // forecast track from ATCF
    fetch("https://ftp.nhc.noaa.gov/atcf/fst/" + s.id + ".fst").then(function (r) {
      return r.text();
    }).then(function (txt) {
      var pts = parseAtcf(txt);
      s.forecastTrack = pts;
      if (pts.length > 1) {
        var line = pts.map(function (p) { return [p.lat, p.lon]; });
        L.polyline(line, { color: "#f43f5e", weight: 3, opacity: 0.9, dashArray: "8 5" }).addTo(stormLayer);
        pts.forEach(function (p) {
          if (p.tau % 24 !== 0 && p.tau !== 0) return;
          L.circleMarker([p.lat, p.lon], { radius: 5, color: "#fff", weight: 2, fillColor: "#1d4ed8", fillOpacity: 1 }).addTo(stormLayer);
          L.marker([p.lat, p.lon], {
            icon: L.divIcon({ className: "", html: '<div class="fcast-label">+' + p.tau + "h " + p.wind + "kt</div>",
              iconSize: [0, 0], iconAnchor: [-10, -14] }),
            interactive: false
          }).addTo(stormLayer);
        });
      }
      mk.on("click", function () { showStorm(s, pts); });
      cb();
    }).catch(function () { cb(); });
  }
  var stormView = false; // driving-mode: user chose to look at the storm, not follow GPS
  function setStorms(on) {
    stormsOn = on;
    savePrefs();
    if (on) markHintSeen();
    $("btn-storms").classList.toggle("active", on);
    if (stormLayer) { if (on) stormLayer.addTo(map); else map.removeLayer(stormLayer); }
  }
  function viewStorm(s) {
    // Center on the storm and flip satellite on: over open water the satellite
    // is the only thing that can actually see the hurricane.
    setStorms(true);
    map.setView([s.latitudeNumeric, s.longitudeNumeric], 5);
    setView("sat");
    showStorm(s, null);
  }
  function stormJump() {
    if (!storms.length) return;
    var b = $("btn-stormjump");
    if (stormView) {
      // back to me
      stormView = false; followMode = true;
      b.textContent = "🌀";
      if (mePos) map.setView([mePos.lat, mePos.lon], Math.max(map.getZoom(), 10));
    } else {
      // go to the storm; pause GPS follow until they jump back
      stormView = true; followMode = false;
      b.textContent = "📍";
      viewStorm(storms[0]);
    }
  }
  function fitStorms() {
    if (!storms.length) return;
    var b = L.latLngBounds(storms.map(function (s) { return [s.latitudeNumeric, s.longitudeNumeric]; }));
    b.extend([HOME.lat, HOME.lon]);
    map.fitBounds(b.pad(0.35));
  }
  function showStorm(s, pts) {
    var cat = catOf(s);
    var el = $("storm-info");
    var last = pts && pts.length ? pts[pts.length - 1] : null;
    el.innerHTML =
      '<div class="sname">' + s.name + '<span class="cat ' + cat.c + '">' + cat.t + "</span></div>" +
      '<div class="storm-row"><span>Wind</span><span>' + s.intensity + " kt</span></div>" +
      '<div class="storm-row"><span>Pressure</span><span>' + s.pressure + " mb</span></div>" +
      '<div class="storm-row"><span>Moving</span><span>' + degToCompass(s.movementDir) + " at " + s.movementSpeed + " kt</span></div>" +
      '<div class="storm-row"><span>Position</span><span>' + s.latitude + " " + s.longitude + "</span></div>" +
      (last ? '<div class="storm-row"><span>5-day track</span><span>' + last.lat.toFixed(1) + "°, " + last.lon.toFixed(1) + "°</span></div>" : "") +
      '<div class="sub" style="margin-top:6px">Forecast track: dashed red line, dots every 24h with wind.</div>';
    el.classList.remove("hidden");
    map.setView([s.latitudeNumeric, s.longitudeNumeric], 5);
  }
  function degToCompass(d) {
    var dirs = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
    return dirs[Math.round(parseFloat(d) / 45) % 8] || "—";
  }

  // ---------- views: Live (NEXRAD) / Future (HRRR) / Past (observed) / Sat (GOES) ----------
  // Exclusive: one view at a time. Live refreshes every 5 min; the time views
  // scrub + play. One global opacity applies to whichever view is showing.
  var radarOpacity = 0.7, radarRefresh = null, futureFrames = [], curFrame = 0;
  function loadRadar() {
    $("radarslider").classList.remove("hidden");
    setView(view); // null on first run = clean map
    if (radarRefresh) clearInterval(radarRefresh);
    radarRefresh = setInterval(refreshLiveRadar, 5 * 60 * 1000);
  }
  // One slider, mode-dependent: Live = opacity fade, time modes = time scrub.
  // Views are exclusive: picking one kills the others. Tapping the active
  // view again turns it off.
  function setView(v) {
    view = v;
    savePrefs();
    if (v) markHintSeen();
    $("mode-live").classList.toggle("active", v === "live");
    $("mode-future").classList.toggle("active", v === "future");
    $("mode-past").classList.toggle("active", v === "past");
    $("mode-sat").classList.toggle("active", v === "sat");
    futurePlay(false);
    moveStormsTo(null); // storms back to current positions
    var sl = $("ctl-slider");
    if (v === "live") {
      $("future-play").classList.add("hidden");
      $("op-row").classList.add("hidden");
      $("slider-ico").textContent = "🌧";
      sl.min = 0; sl.max = 100; sl.value = Math.round(radarOpacity * 100);
      $("op-wrap").title = "Fade view";
      $("time-label").classList.add("hidden");
      showLiveRadar();
    } else if (v === "future" || v === "past" || v === "sat") {
      $("slider-ico").textContent = "🕐";
      $("op-row").classList.remove("hidden");
      $("op-slider").value = Math.round(radarOpacity * 100);
      $("future-play").classList.remove("hidden");
      $("live-updated").classList.add("hidden");
      if (v === "future") { $("op-wrap").title = "Scrub forecast time"; loadFutureRadar(); }
      else if (v === "past") { $("op-wrap").title = "Scrub past radar"; loadPastRadar(); }
      else { $("op-wrap").title = "Scrub satellite time"; loadSatRadar(); }
    } else {
      $("future-play").classList.add("hidden");
      $("op-row").classList.add("hidden");
      if (radarLayer) { map.removeLayer(radarLayer); radarLayer = null; }
      $("time-label").classList.add("hidden");
      $("live-updated").classList.add("hidden");
    }
  }
  // "Future" = HRRR simulated reflectivity, the actual forecast model NOAA runs
  // hourly. Free via IEM tiles; HRRR runs 18h out, frames every 30 min here.
  var futureFramesAt = 0, frameKind = "";
  function loadFutureRadar() {
    if (futureFrames.length && frameKind === "future" && Date.now() - futureFramesAt < 30 * 60000) {
      curFrame = futureFrames.length - 1;
        var sl = $("ctl-slider");
        sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
        $("slider-ico").textContent = "🕐";
        showFutureFrame(curFrame); return;
    }
    $("time-label").textContent = "loading…";
    $("time-label").classList.remove("hidden");
    fetch("https://mesonet.agron.iastate.edu/data/gis/images/4326/hrrr/refd_1080.json")
      .then(function (r) { return r.json(); })
      .then(function (meta) {
        var init = new Date(meta.model_init_utc).getTime();
        if (!init) throw 0;
        var startF = Math.max(0, Math.round((Date.now() - init) / 60000 / 30) * 30);
        var initStr = String(meta.model_init_utc).replace(/\D/g, "").slice(0, 12);
        futureFrames = [];
        for (var f = startF; f <= Math.min(startF + 1080, 1080); f += 30) {
          var fm = ("0000" + f).slice(-4);
          futureFrames.push({
            t: init + f * 60000, mnz: 7,
            url: "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/hrrr::REFD-F" + fm + "-" + initStr + "/{z}/{x}/{y}.png",
            future: true
          });
        }
        frameKind = "future";
        futureFramesAt = Date.now();
        if (!futureFrames.length) { $("time-label").textContent = "unavailable"; return; }
        curFrame = futureFrames.length - 1;
        var sl = $("ctl-slider");
        sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
        $("slider-ico").textContent = "🕐";
        showFutureFrame(curFrame);
      }).catch(function () { $("time-label").textContent = "unavailable"; });
  }
  // "Past" = what already happened: true observed radar frames (RainViewer).
  var pastFramesAt = 0;
  function loadPastRadar() {
    if (futureFrames.length && frameKind === "past" && Date.now() - pastFramesAt < 15 * 60000) {
      curFrame = futureFrames.length - 1;
        var sl = $("ctl-slider");
        sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
        $("slider-ico").textContent = "🕐";
        showFutureFrame(curFrame); return;
    }
    $("time-label").textContent = "loading…";
    $("time-label").classList.remove("hidden");
    fetch("https://api.rainviewer.com/public/weather-maps.json")
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var host = d.host;
        futureFrames = [];
        ((d.radar || {}).past || []).forEach(function (fr) {
          futureFrames.push({
            t: fr.time * 1000, mnz: 7, past: true,
            url: host + fr.path + "/256/{z}/{x}/{y}/2/1_1.png"
          });
        });
        frameKind = "past";
        pastFramesAt = Date.now();
        if (!futureFrames.length) { $("time-label").textContent = "unavailable"; return; }
        curFrame = futureFrames.length - 1;
        var sl = $("ctl-slider");
        sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
        $("slider-ico").textContent = "🕐";
        showFutureFrame(curFrame);
      }).catch(function () { $("time-label").textContent = "unavailable"; });
  }
  // "Sat" = GOES-East infrared loop via NASA GIBS (10-min frames, last ~2h).
  var satFramesAt = 0;
  function loadSatRadar() {
    if (futureFrames.length && frameKind === "sat" && Date.now() - satFramesAt < 15 * 60000) {
      curFrame = futureFrames.length - 1;
        var sl = $("ctl-slider");
        sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
        $("slider-ico").textContent = "🕐";
        showFutureFrame(curFrame); return;
    }
    futureFrames = [];
    // GIBS lags ~1h behind real time; newest frame sits 70 min back so every
    // slot actually exists (a missing slot renders as a blank frame).
    for (var m = 190; m >= 70; m -= 10) {
      var d = new Date(Date.now() - m * 60000);
      d.setUTCSeconds(0, 0);
      d.setUTCMinutes(Math.floor(d.getUTCMinutes() / 10) * 10);
      var tstr = d.toISOString().slice(0, 19) + "Z";
      futureFrames.push({
        t: d.getTime(), mnz: 6, sat: true,
        url: "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_Band13_Clean_Infrared/default/" +
             tstr + "/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png"
      });
    }
    frameKind = "sat";
    satFramesAt = Date.now();
    curFrame = futureFrames.length - 1;
    var sl = $("ctl-slider");
    sl.min = 0; sl.max = futureFrames.length - 1; sl.value = curFrame;
    $("slider-ico").textContent = "🕐";
    showFutureFrame(curFrame);
  }
  var fadeSeq = 0;
  var futurePlayTimer = null;
  function futurePlay(on) {
    if (futurePlayTimer) { clearInterval(futurePlayTimer); futurePlayTimer = null; }
    var b = $("future-play");
    if (b) b.textContent = "▶";
    if (on && futureFrames.length > 1 && (view === "future" || view === "past" || view === "sat")) {
      if (b) b.textContent = "⏸";
      var i = curFrame || 0;
      futurePlayTimer = setInterval(function () {
        i = (i + 1) % futureFrames.length;
        showFutureFrame(i);
      }, 900);
    }
  }
  function showFutureFrame(i) {
    var f = futureFrames[i];
    if (!f) return;
    curFrame = i;
    var my = ++fadeSeq;
    var nl = L.tileLayer(f.url, {
      opacity: 0, zIndex: 10, maxNativeZoom: f.mnz || 7, maxZoom: 18,
      attribution: f.sat ? "GOES via NASA GIBS" : (f.past ? "Radar via RainViewer" : "HRRR via IEM")
    });
    var ol = radarLayer;
    radarLayer = nl;
    if (radarOpacity > 0) nl.addTo(map);
    // smooth crossfade instead of an abrupt pop
    var op = 0, target = radarOpacity, steps = 8;
    (function fade() {
      if (my !== fadeSeq) { if (ol) map.removeLayer(ol); return; } // superseded: drop the old layer
      op += target / steps;
      if (op >= target) {
        nl.setOpacity(target);
        if (ol) map.removeLayer(ol);
      } else {
        nl.setOpacity(op);
        setTimeout(fade, 45);
      }
    })();
    var dt = new Date(f.t);
    var hh = dt.getHours(), mm = ("0" + dt.getMinutes()).slice(-2);
    var ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
    var lbl = $("time-label");
    lbl.textContent = (f.sat ? "Sat " : (f.past ? "Observed " : "Forecast ")) + hh + ":" + mm + " " + ap;
    lbl.classList.remove("hidden");
    $("ctl-slider").value = i;
    if (f.future) moveStormsTo(f.t); // hurricanes ride their forecast track with the scrubber
  }
  // Live: latest NEXRAD mosaic, re-pulled every 5 min with a fresh URL so the
  // WebView can never serve a stale cached tile.
  function liveTileUrl() {
    return "https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png?v=" + Date.now();
  }
  function showLiveRadar() {
    if (radarLayer) map.removeLayer(radarLayer);
    radarLayer = L.tileLayer(liveTileUrl(), {
      opacity: radarOpacity, zIndex: 10, maxNativeZoom: 8, maxZoom: 18,
      attribution: "NEXRAD via IEM"
    });
    if (radarOpacity > 0) radarLayer.addTo(map);
    stampLiveUpdated();
  }
  function refreshLiveRadar() {
    if (view !== "live" || !radarLayer) return;
    radarLayer.setUrl(liveTileUrl()); // new URL = guaranteed fresh, no flicker
    stampLiveUpdated();
  }
  function stampLiveUpdated() {
    // show when this image was pulled (fresh frames land ~every 5 min)
    var dt = new Date(), hh = dt.getHours(), mm = ("0" + dt.getMinutes()).slice(-2);
    var ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
    var lu = $("live-updated");
    lu.textContent = "Live · updated " + hh + ":" + mm + " " + ap;
    lu.classList.remove("hidden");
  }
  function setRadarOpacity(v) {
    radarOpacity = v; // one global opacity: whichever view is showing obeys it
    if (radarLayer) {
      if (v <= 0) { map.removeLayer(radarLayer); }
      else {
        if (!map.hasLayer(radarLayer)) radarLayer.addTo(map);
        radarLayer.setOpacity(v);
      }
    }
  }

  // ---------- GPS: native bridge (AndroidLoc) with web fallback ----------
  // Auto-tracks on open; the map follows you (live view) until you drag it.
  var gpsTimer = null, gpsOn = false, webWatch = null, followMode = false;
  var lastAccepted = null; // last dot position we actually drew
  function distM(la1, lo1, la2, lo2) {
    var R = 6371000, r = Math.PI / 180;
    var a = Math.sin((la2 - la1) * r / 2) ** 2 +
      Math.cos(la1 * r) * Math.cos(la2 * r) * Math.sin((lo2 - lo1) * r / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function gpsFix(la, lo) {
    // Deadzone: ignore jitter. Only move the dot when the new fix is clearly
    // beyond the current one. Tighter while navigating (street-level follow),
    // wider otherwise so the dot sits still when parked.
    var acc = 50, dz = navActive ? 15 : 50;
    try { if (window.AndroidLoc) acc = AndroidLoc.getAcc() || 50; } catch (e) {}
    if (lastAccepted) {
      var d = distM(lastAccepted.lat, lastAccepted.lon, la, lo);
      if (d < Math.max(dz, acc)) return; // sitting still — don't bounce the dot
    }
    lastAccepted = { lat: la, lon: lo };
    mePos = { lat: la, lon: lo };
    maybeLoadBeach(la, lo); // beach card appears only near the coast
    if (!meMarker) {
      meMarker = L.circleMarker([la, lo], { radius: 9, color: "#fff", weight: 3,
        fillColor: "#2563eb", fillOpacity: 1 }).addTo(map);
    } else { meMarker.setLatLng([la, lo]); }
    var b = $("btn-me");
    b.textContent = "📍 On"; b.classList.add("active");
    if (navActive) { navUpdate(la, lo); return; } // nav keeps its own follow
    if (!meFollow) {
      meFollow = true; followMode = true;
      map.setView([la, lo], 10); // launch centers on YOU, zoomed in
    } else if (followMode) {
      map.panTo([la, lo]); // live view: stay locked on
    }
  }
  function pollNativeGps() {
    try {
      if (window.AndroidLoc && AndroidLoc.hasFix()) {
        gpsFix(AndroidLoc.getLat(), AndroidLoc.getLon());
        return true;
      }
    } catch (e) {}
    return false;
  }
  function startGps() {
    if (gpsOn) return;
    gpsOn = true;
    // Native location via the app shell — reliable on-device GPS.
    gpsTimer = setInterval(function () {
      if (pollNativeGps()) return;
      // Fallback: browser geolocation (also covers desktop testing).
      if (webWatch === null && navigator.geolocation) {
        webWatch = navigator.geolocation.watchPosition(function (pos) {
          gpsFix(pos.coords.latitude, pos.coords.longitude);
        }, function () {
          var b = $("btn-me"); b.textContent = "📍 …"; b.classList.remove("active");
        }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
      }
    }, 3000);
    pollNativeGps();
  }
  function toggleMe() {
    // 📍 button = jump back to me and resume live follow
    followMode = true;
    if (mePos) map.setView([mePos.lat, mePos.lon], Math.max(map.getZoom(), 10));
    else meFollow = false; // no fix yet; first fix will center
  }

  // ---------- basemap toggle (street <-> satellite terrain) ----------
  var baseOSM = null, baseSat = null, baseIsSat = false;
  function initBasemaps() {
    baseOSM = map._baseOSM;
    baseSat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 18, attribution: "Imagery © Esri"
    });
  }
  function toggleBase() {
    var b = $("btn-base");
    if (!baseIsSat) { map.removeLayer(baseOSM); baseSat.addTo(map); b.textContent = "🗺 Street"; }
    else { map.removeLayer(baseSat); baseOSM.addTo(map); b.textContent = "🛰 Map"; }
    baseIsSat = !baseIsSat;
    if (radarLayer) radarLayer.bringToFront();
    if (stormLayer) stormLayer.bringToFront();
  }

  // ---------- address search + routing (OSRM) ----------
  var searchSeq = 0, searchTimer = null;
  function searchAddr(q) {
    if (typeof q !== "string") q = $("addr-input").value.trim();
    if (!q) return;
    var box = $("search-results");
    box.innerHTML = '<div class="sr-item">Searching…</div>';
    box.classList.remove("hidden");
    var my = ++searchSeq;
    // bias results toward the user / Florida panhandle
    var vb = "-88.0,32.0,-82.0,28.0";
    if (mePos) vb = (mePos.lon - 2.5) + "," + (mePos.lat + 2.5) + "," + (mePos.lon + 2.5) + "," + (mePos.lat - 2.5);
    var u = "https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=us&viewbox=" + vb +
      "&q=" + encodeURIComponent(q);
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      if (my !== searchSeq) return; // stale response
      if (!d.length) { censusSearch(q, my); return; } // try the Census address database
      box.innerHTML = "";
      d.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "sr-item";
        el.textContent = r.display_name.split(",").slice(0, 3).join(",");
        el.onclick = function () {
          box.classList.add("hidden");
          $("addr-input").value = r.display_name.split(",").slice(0, 2).join(",");
          startNav(parseFloat(r.lat), parseFloat(r.lon), r.display_name.split(",")[0]);
        };
        box.appendChild(el);
      });
    }).catch(function () { if (my === searchSeq) box.innerHTML = '<div class="sr-item">Search failed.</div>'; });
  }
  // US Census geocoder fallback: full TIGER street-address coverage for house
  // numbers Nominatim (OpenStreetMap) doesn't have. Free, no key.
  function censusSearch(q, my) {
    var box = $("search-results");
    var u = "https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?benchmark=Public_AR_Current&format=json&address=" + encodeURIComponent(q);
    fetch(u).then(function (r) { return r.json(); }).then(function (c) {
      if (my !== searchSeq) return;
      var m = ((c.result || {}).addressMatches || []).slice(0, 6);
      if (!m.length) { box.innerHTML = '<div class="sr-item">No results.</div>'; return; }
      box.innerHTML = "";
      m.forEach(function (r) {
        var el = document.createElement("div");
        el.className = "sr-item";
        el.textContent = r.matchedAddress;
        el.onclick = function () {
          box.classList.add("hidden");
          $("addr-input").value = r.matchedAddress.split(",").slice(0, 2).join(",");
          startNav(r.coordinates.y, r.coordinates.x, r.matchedAddress.split(",")[0]);
        };
        box.appendChild(el);
      });
    }).catch(function () { if (my === searchSeq) box.innerHTML = '<div class="sr-item">No results.</div>'; });
  }
  function startNav(dlat, dlon, name) {
    var from = mePos || HOME;
    var u = "https://router.project-osrm.org/route/v1/driving/" + from.lon + "," + from.lat +
      ";" + dlon + "," + dlat + "?overview=full&geometries=geojson&steps=true";
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      var rt = (d.routes || [])[0];
      if (!rt) return;
      endNav(true);
      navActive = true; navDest = { lat: dlat, lon: dlon, name: name };
      navRoute = rt.geometry.coordinates.map(function (c) { return [c[1], c[0]]; });
      navSteps = [];
      (rt.legs[0].steps || []).forEach(function (s) {
        var man = s.maneuver || {};
        navSteps.push({ instr: stepText(s), dist: s.distance,
          loc: [man.location[1], man.location[0]],
          mod: man.modifier || "", type: man.type || "" });
      });
      navLine = L.polyline(navRoute, { color: "#3b82f6", weight: 5, opacity: 0.9 }).addTo(map);
      navDestMk = L.marker([dlat, dlon]).addTo(map).bindPopup("<b>" + name + "</b>");
      $("navpanel").classList.remove("hidden");
      document.body.classList.add("driving"); // driving mode: map + live radar only
      if (view !== "live") setView("live"); // nav gets live radar only
      if (storms.length) $("btn-stormjump").classList.remove("hidden");
      if (mePos) {
        map.setView([mePos.lat, mePos.lon], 15); // street level, like Google Maps
        navUpdate(mePos.lat, mePos.lon);
      } else {
        var s0 = navSteps[0] || { instr: name, type: "", mod: "" };
        $("nav-arrow").textContent = arrowFor(s0.type, s0.mod);
        $("nav-instr").textContent = s0.instr;
        $("nav-sub").textContent = fmtDist(rt.distance) + " · " + fmtDur(rt.duration);
        map.fitBounds(navLine.getBounds().pad(0.2));
      }
    }).catch(function () {});
  }
  function stepText(s) {
    var man = s.maneuver || {}, type = man.type || "", mod = man.modifier || "";
    var road = s.name ? " onto " + s.name : "";
    if (type === "arrive") return "🏁 Arrive";
    if (type === "depart") return "Start" + road;
    if (type === "turn") return "Turn " + mod + road;
    if (type === "new name") return "Continue" + road;
    if (type === "continue") return "Continue" + road;
    if (type === "merge") return "Merge" + road;
    if (type === "roundabout" || type === "rotary") return "Roundabout" + road;
    if (type === "exit roundabout" || type === "exit rotary") return "Exit roundabout" + road;
    return (type + " " + mod + road).trim();
  }
  function arrowFor(type, mod) {
    if (type === "arrive") return "🏁";
    if (mod.indexOf("uturn") >= 0 || mod.indexOf("u-turn") >= 0) return "↩️";
    switch (mod) {
      case "left": return "⬅️";
      case "right": return "➡️";
      case "sharp left": return "↙️";
      case "sharp right": return "↘️";
      case "slight left": return "↖️";
      case "slight right": return "↗️";
      case "straight": return "⬆️";
      default: return type === "depart" ? "🚗" : "⬆️";
    }
  }
  function fmtDist(m) {
    if (m < 500) return Math.round(m * 3.281) + " ft";
    return (m / 1609.34).toFixed(1) + " mi";
  }
  function fmtDur(s) { var m = Math.round(s / 60); return m < 60 ? m + " min" : Math.floor(m / 60) + "h " + (m % 60) + "m"; }
  function navUpdate(la, lo) {
    if (!navActive || !navRoute) return;
    // nearest route point
    var best = 1e9, bi = 0;
    for (var i = 0; i < navRoute.length; i++) {
      var dLa = (navRoute[i][0] - la) * 111320, dLo = (navRoute[i][1] - lo) * 111320 * Math.cos(la * Math.PI / 180);
      var d = Math.sqrt(dLa * dLa + dLo * dLo);
      if (d < best) { best = d; bi = i; }
    }
    if (best > 150) { // off route: re-route
      startNav(navDest.lat, navDest.lon, navDest.name);
      return;
    }
    // find current step: first step whose location is ahead of bi
    var step = navSteps[navSteps.length - 1], si = navSteps.length - 1;
    for (var j = 0; j < navSteps.length; j++) {
      var bd = 1e9;
      for (var k = bi; k < Math.min(bi + 40, navRoute.length); k++) {
        var xLa = (navRoute[k][0] - navSteps[j].loc[0]) * 111320,
            xLo = (navRoute[k][1] - navSteps[j].loc[1]) * 111320;
        var dd = Math.sqrt(xLa * xLa + xLo * xLo);
        if (dd < bd) bd = dd;
      }
      if (bd < 60) { step = navSteps[j]; si = j; break; }
    }
    var rem = 0;
    for (var q = si; q < navSteps.length; q++) rem += navSteps[q].dist;
    var toTurn = distM(la, lo, step.loc[0], step.loc[1]);
    $("nav-arrow").textContent = arrowFor(step.type, step.mod);
    $("nav-instr").textContent = step.instr;
    $("nav-sub").textContent = "in " + fmtDist(toTurn) + " · " + fmtDist(rem) + " to go";
    if (!stormView) map.panTo([la, lo]); // stay on the storm if the user jumped there
  }
  function endNav(silent) {
    navActive = false; navRoute = null; navSteps = [];
    document.body.classList.remove("driving");
    stormView = false;
    $("btn-stormjump").classList.add("hidden");
    $("btn-stormjump").textContent = "🌀";
    if (navLine) { map.removeLayer(navLine); navLine = null; }
    if (navDestMk) { map.removeLayer(navDestMk); navDestMk = null; }
    if (!silent) $("navpanel").classList.add("hidden");
  }

  // ---------- buttons ----------
  function pressable(el, onTap, onLong) {
    // tap = use, hold ~650ms = edit. Works for Home and Fav.
    var timer = null, longFired = false;
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
    el.addEventListener("pointerdown", function () {
      longFired = false;
      timer = setTimeout(function () { timer = null; longFired = true; onLong(); }, 650);
    });
    function cancel() { if (timer) { clearTimeout(timer); timer = null; } }
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointercancel", cancel);
    el.addEventListener("pointerleave", cancel);
    el.addEventListener("click", function (e) {
      if (longFired) { longFired = false; e.preventDefault(); e.stopImmediatePropagation(); return; }
      onTap();
    });
  }
  function censusGeocode(q, cb) {
    var u = "https://geocoding.geo.census.gov/geocoder/locations/onelineaddress?benchmark=Public_AR_Current&format=json&address=" + encodeURIComponent(q);
    fetch(u).then(function (r) { return r.json(); }).then(function (c) {
      var m = ((c.result || {}).addressMatches || []);
      if (!m.length) { cb(null); return; }
      cb({ lat: m[0].coordinates.y, lon: m[0].coordinates.x,
        name: m[0].matchedAddress.split(",").slice(0, 2).join(",") });
    }).catch(function () { cb(null); });
  }
  function geocode(q, cb) {
    var u = "https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=us&q=" + encodeURIComponent(q);
    fetch(u).then(function (r) { return r.json(); }).then(function (d) {
      if (d.length) {
        cb({ lat: parseFloat(d[0].lat), lon: parseFloat(d[0].lon),
          name: d[0].display_name.split(",").slice(0, 2).join(",") });
        return;
      }
      censusGeocode(q, cb); // Nominatim missed it: try the Census address database
    }).catch(function () { censusGeocode(q, cb); });
  }
  // Called by the native shell when Android routes a navigation intent
  // (geo: / google.navigation:) to StormEye — e.g. the GPS button in Spark.
  window.onNavIntent = function (dest) {
    dest = (dest || "").trim();
    if (!dest) return;
    var m = dest.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if (m) { startNav(parseFloat(m[1]), parseFloat(m[2]), "Destination"); return; }
    geocode(dest, function (r) { if (r) startNav(r.lat, r.lon, r.name); });
  };
  function placeHomeMarker() {
    var hicon = L.divIcon({ className: "", html: '<div style="font-size:22px;line-height:22px">⌂</div>',
      iconSize: [22, 22], iconAnchor: [11, 11] });
    if (homeMarker) homeMarker.setLatLng([HOME.lat, HOME.lon]);
    else homeMarker = L.marker([HOME.lat, HOME.lon], { icon: hicon }).addTo(map);
    homeMarker.bindPopup("<b>" + HOME.name + "</b><br>Home base");
  }
  function setHome() {
    var q = prompt("Home address:", HOME.name);
    if (!q) return;
    geocode(q, function (r) {
      if (!r) { alert("Address not found."); return; }
      HOME = r;
      try { localStorage.setItem("stormeye_home", JSON.stringify(HOME)); } catch (e) {}
      placeHomeMarker();
      map.setView([HOME.lat, HOME.lon], 10);
      loadWeather(); loadAlerts();
    });
  }
  function setFav() {
    var q = prompt("Quick destination (e.g. Walmart Marianna FL):", FAV ? FAV.name : "");
    if (!q) return;
    geocode(q, function (r) {
      if (!r) { alert("Not found."); return; }
      FAV = r;
      try { localStorage.setItem("stormeye_fav", JSON.stringify(FAV)); } catch (e) {}
      favLabel();
    });
  }
  function favLabel() {
    $("btn-fav").textContent = FAV ? "★ " + FAV.name.split(",")[0].slice(0, 12) : "★ Fav";
  }
  pressable($("btn-home"),
    function () { map.setView([HOME.lat, HOME.lon], 10); },
    function () { setHome(); });
  pressable($("btn-fav"),
    function () { if (FAV) startNav(FAV.lat, FAV.lon, FAV.name); else setFav(); },
    function () { setFav(); });
  favLabel();
  $("btn-me").onclick = toggleMe;
  $("stormbadge").onclick = function () { followMode = false; fitStorms(); };
  map.on("dragstart", function () { followMode = false; }); // user exploring: pause live view
  $("btn-base").onclick = toggleBase;
  $("addr-go").onclick = function () { searchAddr(); };
  $("addr-input").addEventListener("keydown", function (e) { if (e.key === "Enter") searchAddr(); });
  // autocomplete as you type
  $("addr-input").addEventListener("input", function () {
    var q = this.value.trim();
    clearTimeout(searchTimer);
    if (q.length < 3) { $("search-results").classList.add("hidden"); return; }
    searchTimer = setTimeout(function () { searchAddr(q); }, 450);
  });
  $("nav-end").onclick = function () { endNav(false); };

  initBasemaps();
  startGps(); // auto-track on open — no button needed
  placeHomeMarker();
  // (btn-storms handled below via setStorms)
  $("btn-home").onclick = null; // handled by pressable above (tap = go home, hold = set home)
  favLabel();
  $("btn-storms").classList.toggle("active", stormsOn); // restore saved overlay pref
  $("hint-x").onclick = markHintSeen;
  if (!hintSeen && view === null && !stormsOn) {
    $("hint-chip").classList.remove("hidden"); // first run: show how to turn things on
  }
  $("ctl-slider").oninput = function () {
    if (view === "live") {
      setRadarOpacity(parseInt(this.value, 10) / 100);
      $("op-slider").value = this.value;
    } else { futurePlay(false); showFutureFrame(parseInt(this.value, 10)); }
  };
  $("op-slider").oninput = function () {
    setRadarOpacity(parseInt(this.value, 10) / 100);
    if (view === "live") $("ctl-slider").value = this.value;
  };
  $("future-play").onclick = function () {
    futurePlay(!futurePlayTimer);
  };
  $("mode-live").onclick = function () { setView(view === "live" ? null : "live"); };
  $("mode-future").onclick = function () { setView(view === "future" ? null : "future"); };
  $("mode-past").onclick = function () { setView(view === "past" ? null : "past"); };
  $("mode-sat").onclick = function () { setView(view === "sat" ? null : "sat"); };
  $("btn-storms").onclick = function () { setStorms(!stormsOn); };
  $("btn-stormjump").onclick = stormJump;

  // ---------- bottom sheet: drag the gray handle to collapse / expand ----------
  var sheetOpen = true;
  function setSheet(open) {
    sheetOpen = open;
    var sh = $("sheet");
    // collapsed: lock inner scrolling so a swipe pulls the sheet back up
    // instead of scrolling hidden content
    sh.classList.toggle("locked", !open);
    sh.style.transition = "transform .25s ease";
    sh.style.transform = open ? "" : "translateY(" + Math.max(0, sh.offsetHeight - 42) + "px)";
  }
  (function () {
    var handle = $("sheet-handle"), startY = null, baseT = 0, moved = false;
    function curT() {
      var m = ($("sheet").style.transform || "").match(/translateY\((-?\d+)px\)/);
      return m ? parseInt(m[1], 10) : 0;
    }
    handle.addEventListener("pointerdown", function (e) {
      startY = e.clientY; baseT = curT(); moved = false;
      $("sheet").style.transition = "none";
      try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    });
    handle.addEventListener("pointermove", function (e) {
      if (startY === null) return;
      var dy = e.clientY - startY;
      if (Math.abs(dy) > 6) moved = true;
      var max = Math.max(0, $("sheet").offsetHeight - 42);
      var t = Math.min(max, Math.max(0, baseT + dy));
      $("sheet").style.transform = t ? "translateY(" + t + "px)" : "";
    });
    function endDrag(e) {
      if (startY === null) return;
      var dy = e.clientY - startY;
      startY = null;
      if (!moved) { setSheet(!sheetOpen); return; } // tap toggles
      var max = Math.max(0, $("sheet").offsetHeight - 42);
      setSheet(dy < -40 || curT() < max / 2);
    }
    handle.addEventListener("pointerup", endDrag);
    handle.addEventListener("pointercancel", endDrag);
  })();

  loadWeather();
  loadAlerts();
  loadStorms();
  loadRadar();
  setInterval(loadWeather, 15 * 60 * 1000);
  setInterval(loadAlerts, 15 * 60 * 1000);
  setInterval(loadStorms, 30 * 60 * 1000);
})();
</script>
</body>
</html>
